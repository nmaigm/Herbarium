<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #ffffff;
      line-height: 1.6;
    }

    /* Contact Section */
    .contact-section {
      text-align: center;
      padding: 50px 20px 30px;
    }

    .contact-section h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .contact-section p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      font-weight: bold;
    }

    /* Form */
    form {
      max-width: 500px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 0 10px;
    }

    form input[type="name"],
    form input[type="email"],
    form textarea {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    form input:focus,
    form textarea:focus {
      border-color: #46d31b;
      outline: none;
    }

    form textarea {
      min-height: 120px;
      resize: vertical;
    }

    form button[type="submit"] {
      background-color: #46d31b;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
      width: 100%;
    }

    form button[type="submit"]:hover {
      background-color: #3bb013;
    }

    /* Info Section */
    .info-boxes {
      display: flex;
      justify-content: center;
      align-items: stretch;
      background-color: #e9e9e9;
      padding: 40px 20px;
      gap: 40px;
      flex-wrap: wrap;
    }

    .info-box {
      flex: 1 1 300px;
      max-width: 400px;
      text-align: center;
      padding: 20px;
      background: rgba(255, 255, 255, 0);
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .info-icon {
      background-color: #46d31b;
      color: white;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 50%;
      font-size: 28px;
      margin: 0 auto 15px;
    }

    .icon-image,
    .icon-image2 {
      width: 28px;
      height: 28px;
      object-fit: contain;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    .icon-image:hover {
      transform: scale(1.05);
      opacity: 0.7;
    }

    .info-box h3 {
      margin-bottom: 10px;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .info-box p {
      color: #555;
      margin: 5px 0;
      font-size: 0.95rem;
    }

    .link-text {
      text-decoration: none;
      color: #555;
      transition: text-decoration 0.2s ease;
    }

    .link-text:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .contact-section h1 {
        font-size: 2rem;
      }

      .contact-section p {
        font-size: 1rem;
      }

      .info-boxes {
        flex-direction: column;
        padding: 20px;
      }

      .info-box {
        width: 100%;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
   <div class="contact-section">
    <h1>Contact Us</h1>
    <p>Any questions or remarks? Just write us a message!</p>

    <form action="https://formspree.io/f/xkgbzqnn" method="POST">
      <input type="name" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>
      <textarea name="message" placeholder="Your message..." required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <div class="info-boxes">
    <div class="info-box">
      <div class="info-icon">
        <img src="phone.png" alt="Phone" class="icon-image2">
      </div>
      <h3>PHONE (LANDLINE)</h3>
      <p>+20 109 567 925 6</p>
      <p>+20 107 051 780 2</p>
    </div>

    <div class="info-box">
      <div class="info-icon">
        <a href="https://www.google.com/maps/place/%D9%83%D9%84%D9%8A%D8%A9+%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85+%D8%AC%D8%A7%D9%85%D8%B9%D8%A9+%D8%A7%D9%84%D8%A3%D8%B2%D9%87%D8%B1+%D9%81%D8%B1%D8%B9+%D8%A7%D9%84%D8%A8%D9%86%D8%A7%D8%AA+%D8%A8%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9" 
           target="_blank" rel="noopener noreferrer" class="link-text">
          <img src="location.png" alt="Location" class="icon-image">
        </a>
      </div>
      <h3>OUR OFFICE LOCATION</h3>
      <p>
        <a href="https://www.google.com/maps/place/%D9%83%D9%84%D9%8A%D8%A9+%D8%A7%D9%84%D8%B9%D9%84%D9%88%D9%85+%D8%AC%D8%A7%D9%85%D8%B9%D8%A9+%D8%A7%D9%84%D8%A3%D8%B2%D9%87%D8%B1+%D9%81%D8%B1%D8%B9+%D8%A7%D9%84%D8%A8%D9%86%D8%A7%D8%AA+%D8%A8%D8%A7%D9%84%D9%82%D8%A7%D9%87%D8%B1%D8%A9" 
           target="_blank" rel="noopener noreferrer" class="link-text">
          Faculty of Science, Girls' Branch, Cairo,<br> Al-Azhar University
        </a>
      </p>
    </div>
  </div>
</body>
</html>
