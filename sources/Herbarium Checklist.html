<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Herbarium Checklist</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      display: flex;
      height: 100%;
      width: 100%;
      flex-direction: row;
    }

    /* Sidebar iframe */
    #Main-List {
      width: 200px;
      border: none;
      height: 100%;
      transition: max-height 0.4s ease; /* smooth animation */
    }

    /* Wide content iframe */
    #Sub-List {
      flex-grow: 1;
      border: none;
      height: 100%;
      background: white;
      text-align: left;   
    }

    h1 {
      font-size: 48px;
      font-weight: bold;
      color: #333;
      text-transform: uppercase;
      border-bottom: 4px solid #666;
      padding-bottom: 10px;
      left: 420px;
      position: fixed;
      top: 0;
      text-align: center;   
      z-index: 1000;
      background: white;
      width: calc(100% - 420px);
    }

    .dots {
      visibility: hidden;
    }

    /* 🔽 Menu button - hidden on desktop */
    #menuBtn {
      display: none;
      background: #4caf50;
      color: rgb(255, 255, 255);
      border: none;
      padding: 10px 15px;
      font-size: 18px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }

    /* ======================
       RESPONSIVE DESIGN
    ====================== */
    @media (max-width: 768px) {
      h1 {
        display: none; /* hide title */
      }

      .container {
        flex-direction: column;
      }

      #Main-List {
        width: 100%;
        max-height: 0;  /* collapsed */
        overflow: hidden;
      }

      #Main-List.open {
        max-height: 250px; /* expanded */
      }

      #Sub-List {
        height: calc(100% - 50px); /* space for menu button */
      }

      #menuBtn {
        display: block; /* show only on mobile */
      }
    }
    
    @media (max-width: 380px) {
  h1 {
    display: none; /* hide the fixed header for more space */
  }

  #Main-List {
    width: 100%;
    max-height: 0;
    overflow: hidden;
  }

  #Main-List.open {
    max-height: 220px; /* slightly smaller to fit */
  }

  #Sub-List {
    height: calc(100% - 45px); /* adjust to fit screen */
  }

  #menuBtn {
    display: block;
    font-size: 16px; /* smaller button text */
    padding: 8px 12px;
  }
}
  </style>
</head>
<body>

  <!-- 🔽 Menu button -->
  <button id="menuBtn"><center>︾</center></button>

  <div class="container">
    <iframe id="Main-List" src="./main list.html"></iframe>
    <h1 id="herbaruim">
      <b><span class="dots">..........</span></b>
      Herbarium Checklist
      <b><span class="dots">..........</span></b>
    </h1>
    <iframe id="Sub-List" src="./';'.html"></iframe>
  </div>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const mainList = document.getElementById("Main-List");

    // Toggle Main-List with slide animation
    menuBtn.addEventListener("click", () => {
      mainList.classList.toggle("open");
    });

    function loadSubList(url, title) {
      document.getElementById('Sub-List').src = url;
      document.title = title + " - Herbarium";
      document.getElementById('herbaruim').style.display = 'none'; 
      mainList.classList.remove("open"); // auto-close after selecting
    }

    // Communicate with main list iframe
    window.addEventListener('message', function(event) {
      if (event.data.type === 'loadSubList') {
        loadSubList(event.data.url, event.data.title);
      }
    });
  </script>

</body>
</html>
